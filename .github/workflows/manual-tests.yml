# Manual Test Run: запуск тестів вручну через GitHub UI
name: Manual Test Run

on:
  workflow_dispatch:  # Дозволяє запускати workflow вручну через GitHub UI (Actions > Run workflow)
    inputs:
      test_path:
        description: 'Test path (e.g., tests/test_api.py)'  # Шлях до тесту
        required: false
        default: 'tests/'
      python_version:
        description: 'Python version'  # Вибір версії Python
        required: false
        default: '3.11'
        type: choice
        options:
        - '3.9'
        - '3.10'
        - '3.11'

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code  # Клонує репозиторій
      uses: actions/checkout@v4

    - name: Set up Python ${{ github.event.inputs.python_version }}  # Встановлює Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ github.event.inputs.python_version }}

    - name: Install dependencies  # Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run specific tests  # Запуск вибраних тестів
      run: |
        pytest ${{ github.event.inputs.test_path }} -v --cov=app --cov-report=term