# CI Pipeline: автоматичне тестування, лінтинг, типізація та перевірка безпеки
name: CI Pipeline

on:
  push:  # Автоматичний запуск workflow при кожному push (зміни у вибраних гілках)
    branches: [ main, develop ]  # Запуск при пуші в main або develop
  pull_request:  # Автоматичний запуск workflow при створенні або оновленні Pull Request у вибраних гілках
    branches: [ main, develop ]  # Запуск при створенні PR в main або develop
  workflow_dispatch:  # Дозволяє запускати workflow вручну через GitHub UI (Actions > Run workflow)

jobs:
  test:
    runs-on: ubuntu-latest  # Оточення для запуску
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]  # Тести для різних версій Python

    steps:
    - name: Checkout code  # Клонує репозиторій
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}  # Встановлює Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies  # Кешування залежностей
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies  # Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8  # Перевірка стилю коду
      run: |
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check code formatting with black  # Перевірка форматування
      run: |
        black --check app tests

    - name: Check import sorting with isort  # Перевірка сортування імпортів
      run: |
        isort --check-only app tests

    - name: Type checking with mypy  # Перевірка типів
      run: |
        mypy app

    - name: Run tests with pytest  # Запуск тестів
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov  # Завантаження покриття коду
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install security tools  # Встановлення інструментів безпеки
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan  # Статичний аналіз безпеки
      run: |
        bandit -r app -f json -o bandit-report.json

    - name: Check dependencies for vulnerabilities  # Перевірка залежностей
      run: |
        safety check --json --output safety-report.json

    - name: Upload security reports  # Завантаження звітів
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json